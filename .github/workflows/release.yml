name: release
# Pushing a tag like v1.0.0 builds the APKs and publishes a GitHub release with them attached.
# Signing: add ANDROID_KEYSTORE_B64 (base64 keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# as repository secrets to get a signed release APK/AAB; without them the release APK is unsigned.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: pip install pillow numpy
      - name: Verify
        run: |
          ./gradlew :core:test
          ./gradlew :tools:levels:installDist && tools/levels/build/install/levels/bin/levels validate
          python3 tools/asset_import/check_runtime_assets.py
          ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Restore keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks" && echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DumplingRings-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release*.apk "dist/DumplingRings-${GITHUB_REF_NAME}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/DumplingRings-${GITHUB_REF_NAME}-release.aab"
          cp content/qa/validation_report.md "dist/level-validation-${GITHUB_REF_NAME}.md"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Dumpling Rings ${{ github.ref_name }}"
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
